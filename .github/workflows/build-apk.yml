name: Build Taxi Profit AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Taxi_Profit_AI_v0.17_source.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -f Taxi_Profit_AI_v0.17_source.zip ]; then
            unzip -o Taxi_Profit_AI_v0.17_source.zip -x '.github/*' -d android-project
          elif [ -f app/build.gradle.kts ]; then
            mkdir -p android-project
            cp -r app build.gradle.kts settings.gradle.kts gradle.properties android-project/
          else
            echo 'Android source archive missing'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble test APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiProfitAI-v17-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
