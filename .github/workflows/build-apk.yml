name: Build Taxi Profit AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Taxi_Profit_AI_v0.17_source.zip'
      - '.github/workflows/build-apk.yml'
      - 'branding/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -f Taxi_Profit_AI_v0.17_source.zip ]; then
            unzip -o Taxi_Profit_AI_v0.17_source.zip -x '.github/*' -d android-project
          elif [ -f app/build.gradle.kts ]; then
            mkdir -p android-project
            cp -r app build.gradle.kts settings.gradle.kts gradle.properties android-project/
          else
            echo 'Android source archive missing'
            exit 1
          fi
      - name: Apply approved launcher icon
        shell: bash
        run: |
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          ICON=android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          base64 -d branding/launcher-icon.webp.b64 > "$ICON"
          echo "c4c6c211027c4edca87b8da6997661a3429cc2380a23208162a08389eea9aa14  $ICON" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          m = Path("android-project/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          assert '<application ' in s and 'android:icon=' not in s
          m.write_text(s.replace('<application ', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" ', 1))
          g = Path("android-project/app/build.gradle.kts")
          s = g.read_text()
          assert 'versionCode = 17' in s
          g.write_text(s.replace('versionCode = 17', 'versionCode = 18').replace('0.17.0-approved-overlays', '0.18.0-branded'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$MANAGER"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          echo "Android SDK ready at $SDK"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble test APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify packaged launcher icon
        shell: bash
        run: |
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "versionCode='18'" apk-badging.txt
          grep -q "application-icon-480:.*ic_launcher" apk-badging.txt
          unzip -l "$APK" | grep ic_launcher
          cp "$APK" TaxiProfitAI-v18.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiProfitAI-v18-branded-apk
          path: TaxiProfitAI-v18.apk
          retention-days: 7
          if-no-files-found: error
