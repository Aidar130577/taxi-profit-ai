name: Export source for private technical review
on:
  workflow_dispatch:
  push:
    branches: [fix/v47-road-only]
    paths: ['.github/workflows/export-review.yml']
permissions:
  contents: read
  issues: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -f Taxi_Profit_AI_v0.17_source.zip ]; then
            unzip -o Taxi_Profit_AI_v0.17_source.zip -x '.github/*' -d android-project
          elif [ -f app/build.gradle.kts ]; then
            mkdir -p android-project
            cp -r app build.gradle.kts settings.gradle.kts gradle.properties android-project/
          else
            echo 'Android source archive missing'
            exit 1
          fi
      - name: Apply compact main screen
        run: |
          cd android-project
          python3 ../patches/simplify_main_v19.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/kz/taxiprofitai/MainActivity.kt")
          s=p.read_text()
          a=s.index('        more=action(')
          b=s.index('        root.addView(action("OK',a)
          s=s[:a]+s[b:]
          a=s.index('        stop=action(')
          b=s.index('        scroll.addView(root)',a)
          s=s[:a]+s[b:]
          s=s.replace('        stop.visibility=if(prefs.getBoolean("shift_active",false))View.VISIBLE else View.GONE','')
          s=s.replace('Выбери свои тарифы','Мои тарифы')
          a=s.index('    private fun save(): Boolean {')
          b=s.index('    private fun showTest()',a)
          s=s[:a]+'''    private fun save(): Boolean {
                  val p=park.text.toString().trim().replace(',','.').toDoubleOrNull()
                  val rates=checks.keys.mapNotNull { CommissionSettings.percent(prefs,it) }
                  if(p==null || !p.isFinite() || p !in 0.0..100.0 || rates.any{it+p>100.0}){
                      Toast.makeText(this,"Проверьте комиссию таксопарка",Toast.LENGTH_LONG).show()
                      return false
                  }
                  prefs.edit().apply {
                      checks.forEach{(name,c)->putBoolean("tariff_$name",c.isChecked)}
                      putBoolean("airport",airport.isChecked)
                      putString("park",p.toString())
                      putInt("loyalty_discount",0)
                  }.apply()
                  return true
              }
          '''+s[b:]
          a=s.index('                    prefs.edit().putBoolean("shift_active",true).apply()')
          b=s.index('                    moveTaskToBack(true)',a)+len('                    moveTaskToBack(true)')
          s=s[:a]+'                    startRadar()'+s[b:]
          at=s.index('    private fun openPermissions()')
          s=s[:at]+'''    private fun startRadar(){
                  fun start(){
                      prefs.edit().putBoolean("shift_active",true).apply()
                      moveTaskToBack(true)
                  }
                  val installed=try{
                      packageManager.getPackageInfo("btools.routingapp",0)
                      true
                  }catch(e:android.content.pm.PackageManager.NameNotFoundException){false}
                  if(installed){start();return}
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Расчёт маршрута")
                      .setMessage("Для расчёта стоимости поездки этой тестовой версии нужен BRouter с картой Алматы. Без него можно проверить радар, но прогноз цены недоступен.")
                      .setNegativeButton("Только радар"){_,_->start()}
                      .setPositiveButton("Установить BRouter"){_,_->
                          startActivity(Intent(Intent.ACTION_VIEW,android.net.Uri.parse("https://f-droid.org/packages/btools.routingapp/")))
                      }.show()
              }
          '''+s[at:]
          assert 'Дополнительные настройки' not in s
          assert 'title("Скидка' not in s
          p.write_text(s)
          PY
      - name: Add local OCR and language models
        shell: bash
        run: |
          cd android-project
          python3 ../patches/window_ocr_v21.py
          python3 ../patches/purple_demand_v22.py
          python3 ../patches/accept_bar_v23.py
          python3 ../patches/calculator_overlay_v24.py
          patch --batch -p1 < ../patches/calculator-v25.patch
          patch --batch -p1 < ../patches/calculator-v26.patch
          patch --batch -p1 < ../patches/calculator-v27.patch
          patch --batch -p1 < ../patches/calculator-v28.patch
          patch --batch -p1 < ../patches/calculator-v29.patch
          patch --batch -p1 < ../patches/calculator-v30.patch
          patch --batch -p1 < ../patches/calculator-v31.patch
          patch --batch -p1 < ../patches/calculator-v32.patch
          patch --batch -p1 < ../patches/calculator-v33.patch
          patch --batch -p1 < ../patches/calculator-v34.patch
          patch --batch -p1 < ../patches/calculator-v35.patch
          patch --batch -p1 < ../patches/calculator-v36.patch
          patch --batch -p1 < ../patches/calculator-v37.patch
          patch --batch -p1 < ../patches/calculator-v38.patch
          patch --batch -p1 < ../patches/calculator-v39.patch
          patch --batch -p1 < ../patches/calculator-v40.patch
          patch --batch -p1 < ../patches/calculator-v41.patch
          patch --batch -p1 < ../patches/calculator-v42.patch
          python3 ../patches/stability_v43.py
          python3 ../patches/road_packs_v43.py
          python3 ../patches/traffic_pilot_v43.py
          python3 ../patches/hyperos_recovery_v44.py
          python3 ../patches/unified_learning_v44.py
          python3 ../patches/route_diagnostics_v45.py
          python3 ../patches/shortest_route_v45.py
          python3 ../patches/road_only_v47.py
          python3 ../patches/dual_fare_v47.py
          python3 ../patches/passenger_warning_v48.py
          python3 ../patches/eta_training_export_v48.py
          python3 ../patches/tomtom_pilot_v49.py
      - name: Apply approved launcher icon
        shell: bash
        run: |
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          ICON=android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          base64 -d branding/launcher-icon.webp.b64 > "$ICON"
          echo "7e9b1860e41668d4083c07e11c3f719ec28841c61e8957cb690acf4c0e301f74  $ICON" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          m = Path("android-project/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          assert '<application ' in s and 'android:icon=' not in s
          m.write_text(s.replace('<application ', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" ', 1))
          g = Path("android-project/app/build.gradle.kts")
          s = g.read_text()
          assert 'versionCode = 17' in s
          assert 'minSdk = 26' in s
          assert 'applicationId = "kz.taxiprofitai"' in s
          s = s.replace('applicationId = "kz.taxiprofitai"', 'applicationId = "kz.taxiprofitai.roadonly"')
          g.write_text(s.replace('minSdk = 26', 'minSdk = 29').replace('versionCode = 17', 'versionCode = 49').replace('0.17.0-approved-overlays', '0.49.0-tomtom-pilot'))
          PY
      - name: Export source and issue without private data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/9" --jq .body > issue9-original.md
          python3 - <<'PY'
          import pathlib, re, shutil, zipfile, os
          P=pathlib.Path
          out=P("review");out.mkdir()
          docs=out/"docs";docs.mkdir()
          for name in ("MASTER_SPEC_ZNAY_TSENU.md","UNKNOWN_ORDER_CLASSIFIER.md","ADAPTIVE_PRICE_RESEARCH.md","TOMTOM_PILOT_V49.md"):
              shutil.copyfile(P("docs")/name,docs/name)
          issue=P("issue9-original.md").read_text()
          # Remove specific real trip endpoints/coordinates; preserve diagnostic evidence.
          for private in ("әл фараби 7 корпус 5а","омаровой жамал 21","Достык 535","Байконурская 128"):
              issue=issue.replace(private,"[адрес скрыт]")
          issue=re.sub(r"\b4[23]\.\d{4,}\s*,\s*7[567]\.\d{4,}\b","[координаты скрыты]",issue)
          (docs/"ISSUE_9.md").write_text("# Issue #9 — копия для технического анализа\nАдреса и точные координаты отдельных поездок скрыты. Остальное — исторический текст журнала.\n\n"+issue)
          allowed={".kt",".java",".kts",".gradle",".properties",".xml",".aidl",".py",".sh",".patch",".brf",".md",".yml",".yaml",".txt",".pro",".json"}
          base=P("android-project")
          count=0
          for src in base.rglob("*"):
              if not src.is_file() or src.is_symlink() or src.suffix.lower() not in allowed: continue
              rel=src.relative_to(base)
              if any(x in {".git",".gradle","build","assets","libs","local.properties","google-services.json","secrets.properties"} for x in rel.parts): continue
              if not (str(rel).startswith(("app/src/","core-tests/")) or str(rel) in {"app/build.gradle.kts","build.gradle.kts","settings.gradle.kts","gradle.properties","app/proguard-rules.pro"}): continue
              dest=out/"android-source"/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dest);count+=1
          for folder in ("patches","ci","training"):
              for src in P(folder).rglob("*"):
                  if src.is_file() and not src.is_symlink() and src.suffix in {".py",".sh",".patch",".brf",".md",".txt"}:
                      dest=out/src;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dest)
          shutil.copyfile(".github/workflows/build-apk.yml",out/"build-apk.yml")
          (out/"README.md").write_text("""# Знай цену — материалы для независимого анализа
          Снимок ветки fix/v47-road-only. Код Android восстановлен из базового ZIP последовательным применением всех патчей до v49.
          Начать с docs/MASTER_SPEC_ZNAY_TSENU.md и docs/ISSUE_9.md. TomTom — отдельный пилот, CatBoost — подготовка обучения, не готовая модель.
          Ключевые модули в android-source/app/src/main/java/kz/taxiprofitai: Engine.kt, RadarAccessibilityService.kt, OfferPopupView.kt, OfflineRoutePipeline.kt, BRouterConnector.kt, EmbeddedRoadRouter.kt, DualFareMean.kt, TomTomRouter.kt, TomTomPilot.kt, TrialStore.kt, LearnedRates.kt.
          Бинарные карты, OCR-модели, сторонние JAR, APK, ключи, история Git и пользовательские данные не включены. Это комплект исходников для анализа, не готовая автономная сборка. build-apk.yml показывает оригинальную процедуру сборки; patches и training включены для проверки происхождения кода.
          """.replace("\n          ","\n")+"\nCommit: "+os.environ["GITHUB_SHA"]+"\n")
          # Fail closed for common secret formats. No secret values in logs.
          patterns=[r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",r"gh[pousr]_[A-Za-z0-9]{30,}",r"github_pat_[A-Za-z0-9_]{30,}",r"sk-(?:proj-)?[A-Za-z0-9_-]{30,}",r"AKIA[A-Z0-9]{16}",r"eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}",r"(?i)(?:api[_-]?key|tomtom_key|service_role_key|password|secret)\s*[:=]\s*[\"'][A-Za-z0-9_+/=-]{24,}[\"']"]
          for file in out.rglob("*"):
              if file.is_file():
                  t=file.read_text(errors="replace")
                  if any(re.search(p,t) for p in patterns):
                      raise SystemExit("Possible credential in "+str(file)+"; review before sharing")
          assert count>=20
          for name in ("Engine.kt","RadarAccessibilityService.kt","OfflineRoutePipeline.kt","TomTomRouter.kt","BRouterConnector.kt","DualFareMean.kt"):
              assert list((out/"android-source").rglob(name)),name
          with zipfile.ZipFile("ZnayTsenu-v49-review.zip","w",zipfile.ZIP_DEFLATED) as z:
              for file in sorted(out.rglob("*")):
                  if file.is_file():z.write(file,file.relative_to(out))
          print("Exported",count,"Android source files; common secret scan passed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZnayTsenu-v49-private-review
          path: |
            ZnayTsenu-v49-review.zip
            review/docs/MASTER_SPEC_ZNAY_TSENU.md
            review/docs/ISSUE_9.md
          retention-days: 7
          if-no-files-found: error
